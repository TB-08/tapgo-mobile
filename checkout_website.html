<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAPGO - Thanh toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="data.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#F48133', hover: '#E06B1F', bg: '#FFF3EB' },
                        danger: '#EF4444', success: '#10B981'
                    }
                },
                screens: {
                    'sm': '9999px', 'md': '9999px', 'lg': '9999px', 'xl': '9999px', '2xl': '9999px'
                }
            }
        }
    </script>
    <style>
        :root {
            --mobile-width: 428px;
        }

        body {
            background-color: transparent !important;
            font-family: 'Be Vietnam Pro', sans-serif !important;
            max-width: var(--mobile-width) !important;
            margin: 0 auto !important;
            min-height: 100dvh !important;
            box-shadow: 0 0 100px rgba(0,0,0,0.1) !important;
            position: relative !important;
            overflow-x: hidden !important;
            padding-bottom: 100px !important;
        }

        .pt-safe {
            padding-top: 47px;
        }

        .status-bar-mock {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--mobile-width);
            height: 47px;
            z-index: 2000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            pointer-events: none;
        }

        [x-cloak] { display: none !important; }

        /* DA NANG SIGNATURE BACKGROUND */
        .danang-vibe-bg {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 428px;
            height: 100%;
            background: linear-gradient(rgba(250, 250, 250, 0.88), rgba(250, 250, 250, 0.88)), url('danang_dragon_bridge_bg_1778333910476.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center bottom;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body x-data="{ step: 1, paymentMethod: 'tapcoin', qty: 1 }" class="text-gray-900 antialiased font-sans flex flex-col min-h-screen">
    <!-- DA NANG SIGNATURE BACKGROUND LAYER -->
    <div class="danang-vibe-bg"></div>

    <!-- STATUS BAR MOCKUP -->
    <div class="status-bar-mock">
        <div class="flex-1">9:41</div>
        <div class="flex gap-1.5 items-center">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- MOBILE HEADER -->
    <header class="bg-white/90 backdrop-blur-xl sticky top-0 z-[100] border-b border-gray-100/50 pt-safe shadow-sm">
        <div class="px-4 py-4 flex items-center gap-3">
            <button @click="step === 1 ? window.location.href='product_detail.html' : step = 1" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-gray-600">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1 class="text-lg font-bold flex-1" x-text="step === 1 ? 'Thanh toán' : 'Kết quả'"></h1>
        </div>
    </header>

    <main class="w-full p-4 space-y-6 flex-1">
        
        <div x-show="step === 1" class="space-y-6" x-transition>
            <!-- Delivery Info -->
            <div class="bg-white p-5 rounded-3xl border border-gray-100 space-y-4">
                <div class="flex items-center gap-2 text-brand font-bold text-sm">
                    <i class="fas fa-map-marker-alt"></i> Thông tin nhận Voucher
                </div>
                <div class="space-y-3">
                    <input type="text" value="Lê Anh Tú" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-brand">
                    <input type="tel" value="0988 123 456" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-brand">
                    <input type="email" value="anhtu.le@gmail.com" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-brand">
                </div>
            </div>

            <!-- Product Summary -->
            <div class="bg-white p-5 rounded-3xl border border-gray-100 flex gap-4">
                <img src="https://images.unsplash.com/photo-1544148103-0773bf10d330?q=80&w=200" class="w-20 h-20 rounded-2xl object-cover border border-gray-50">
                <div class="flex-1 space-y-1">
                    <h3 class="text-sm font-bold leading-snug line-clamp-2">Combo Thịt Nướng Nhật Bản Bao Gồm Lẩu VIP</h3>
                    <p class="text-[11px] text-gray-400">Hệ thống Yakimono</p>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-brand font-bold">189.000đ</span>
                        <div class="flex items-center gap-3 bg-gray-100 rounded-xl px-2 py-1">
                            <button @click="qty = Math.max(1, qty-1)" class="text-gray-500 font-bold px-1">-</button>
                            <span class="text-xs font-bold w-4 text-center" x-text="qty"></span>
                            <button @click="qty++" class="text-gray-500 font-bold px-1">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Payment Methods -->
            <div class="space-y-4">
                <h3 class="text-sm font-bold ml-1">Phương thức thanh toán</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-4 p-4 rounded-2xl border transition-all" :class="paymentMethod === 'tapcoin' ? 'border-brand bg-brand-bg/50' : 'border-gray-100 bg-white'">
                        <input type="radio" value="tapcoin" x-model="paymentMethod" class="w-5 h-5 accent-brand">
                        <div class="flex-1">
                            <p class="text-sm font-bold">Ví TapCoin</p>
                            <p class="text-[11px] text-brand font-bold">Số dư: 8,500 <i class="fas fa-coins text-[9px] ml-0.5"></i></p>
                        </div>
                        <i class="fas fa-coins text-2xl text-yellow-400/30"></i>
                    </label>
                    <label class="flex items-center gap-4 p-4 rounded-2xl border transition-all" :class="paymentMethod === 'momo' ? 'border-brand bg-brand-bg/50' : 'border-gray-100 bg-white'">
                        <input type="radio" value="momo" x-model="paymentMethod" class="w-5 h-5 accent-brand">
                        <div class="flex-1 text-sm font-bold">Ví MoMo</div>
                        <img src="https://developers.momo.vn/v3/assets/images/MOMO-Logo-App-6262c3743a290ef02396a24ea2b66c35.png" class="w-7 h-7">
                    </label>
                    <label class="flex items-center gap-4 p-4 rounded-2xl border transition-all" :class="paymentMethod === 'zalopay' ? 'border-brand bg-brand-bg/50' : 'border-gray-100 bg-white'">
                        <input type="radio" value="zalopay" x-model="paymentMethod" class="w-5 h-5 accent-brand">
                        <div class="flex-1 text-sm font-bold">Ví ZaloPay</div>
                        <img src="https://cdn.haitrieu.com/wp-content/uploads/2022/10/Logo-ZaloPay-Square.png" class="w-7 h-7">
                    </label>
                </div>
            </div>
        </div>

        <!-- Success Screen -->
        <div x-show="step === 2" class="text-center space-y-8 pt-10" style="display:none" x-transition>
            <div class="w-24 h-24 bg-success/10 text-success rounded-full flex items-center justify-center mx-auto text-4xl animate-bounce">
                <i class="fas fa-check"></i>
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-bold text-gray-900">Thanh toán thành công!</h2>
                <p class="text-sm text-gray-500">Mã Voucher đã được gửi về email của bạn.</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-xl space-y-4 max-w-xs mx-auto">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=TAPGO_SUCCESS_EVOUCHER_77B5X&color=F48133" class="w-40 h-40 mx-auto p-2 border border-gray-50 rounded-xl">
                <div class="space-y-1">
                    <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">Mã bảo mật</p>
                    <p class="text-2xl font-bold text-gray-900 tracking-wider">77B5-X9QR</p>
                </div>
            </div>
            <a href="my_vouchers.html" class="block w-full max-w-xs mx-auto bg-gray-900 text-white font-bold py-4 rounded-2xl active:scale-95 transition-transform">
                Xem trong Ví Voucher
            </a>
        </div>

    </main>

    <!-- STICKY BOTTOM SUMMARY (Only for step 1) -->
    <div x-show="step === 1" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[428px] bg-white border-t border-gray-100 p-4 pb-safe flex items-center justify-between z-[500] shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
        <div>
            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-widest">Tổng cộng</p>
            <p class="text-xl font-bold text-brand" x-text="(189000 * qty).toLocaleString() + 'đ'"></p>
        </div>
        <button @click="step = 2; window.scrollTo(0,0)" class="bg-brand text-white font-bold px-10 py-4 rounded-2xl shadow-lg shadow-brand/20 active:scale-95 transition-transform">
            Thanh toán
        </button>
    </div>

</body>

</html>
