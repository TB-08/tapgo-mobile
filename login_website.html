<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAPGO - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#F48133', hover: '#E06B1F', bg: '#FFF3EB' }
                    }
                },
                screens: {
                    'sm': '9999px', 'md': '9999px', 'lg': '9999px', 'xl': '9999px', '2xl': '9999px'
                }
            }
        }
    </script>
    <style>
        :root {
            --mobile-width: 428px;
        }

        body {
            background: 
                linear-gradient(rgba(255, 243, 235, 0.8), rgba(255, 243, 235, 0.9)),
                url('danang_dragon_bridge_bg_1778333910476.png') !important;
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
            font-family: 'Be Vietnam Pro', sans-serif !important;
            max-width: var(--mobile-width) !important;
            margin: 0 auto !important;
            min-height: 100dvh !important;
            box-shadow: 0 0 100px rgba(0,0,0,0.05) !important;
            position: relative !important;
            overflow: hidden !important;
        }

        /* Hide scrollbar for all browsers */
        *::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pt-safe {
            padding-top: 47px;
        }

        .status-bar-mock {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--mobile-width);
            height: 47px;
            z-index: 2000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            pointer-events: none;
        }

    <style>
        @keyframes tap-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.9); }
        }
        .tap-active:active {
            animation: tap-bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .logo-glow {
            filter: drop-shadow(0 0 15px rgba(244, 129, 51, 0.2));
        }
    </style>
</head>

<body x-data="{ step: 'login' }" class="text-gray-900 antialiased font-sans flex flex-col min-h-screen">


    <!-- STATUS BAR MOCKUP -->
    <div class="status-bar-mock">
        <div class="flex-1">9:41</div>
        <div class="flex gap-1.5 items-center">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- MOBILE HEADER -->
    <header class="sticky top-0 z-[100] pt-safe">
        <div class="px-4 py-4">
            <a href="home_website.html" class="w-10 h-10 flex items-center justify-center bg-white shadow-sm border border-gray-100 rounded-full text-gray-400 active:scale-90 transition">
                <i class="fas fa-chevron-left"></i>
            </a>
        </div>
    </header>

    <main class="w-full px-6 py-4 flex flex-col items-center flex-1 justify-center relative z-10">
        <div class="mb-10 text-center cursor-pointer tap-active group">
            <div class="relative inline-block logo-glow transition-transform group-hover:scale-105">
                <img src="Tap Go-Photoroom.png" alt="TAPGO" class="h-16 w-auto mx-auto">
                <div class="absolute -inset-4 bg-brand/10 rounded-full blur-2xl opacity-0 group-active:opacity-100 transition-opacity"></div>
            </div>
        </div>

        <div class="w-full login-card rounded-[3rem] p-8 space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-black text-gray-900 leading-tight" x-text="step === 'login' ? 'Vui quá! Gặp lại bạn rồi' : 'Chào bạn mới đến với TapGO!'"></h2>
                <p class="text-[14px] text-gray-400 font-medium" x-text="step === 'login' ? 'Đăng nhập để nhận ngàn Deal hời' : 'Trở thành thợ săn Deal ngay hôm nay'"></p>
            </div>

            <div class="space-y-4 pt-2">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-brand ml-1 uppercase tracking-widest">Số điện thoại / Email</label>
                    <input type="text" placeholder="Nhập thông tin của bạn" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 focus:outline-none focus:border-brand focus:ring-4 focus:ring-brand/5 transition-all font-bold text-sm">
                </div>
                <div class="space-y-1" x-show="step === 'login'">
                    <label class="text-[11px] font-bold text-brand ml-1 uppercase tracking-widest">Mật khẩu</label>
                    <div class="relative">
                        <input type="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-2xl px-5 py-4 focus:outline-none focus:border-brand focus:ring-4 focus:ring-brand/5 transition-all font-bold text-sm">
                        <i class="fa-regular fa-eye-slash absolute right-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                    </div>
                </div>
            </div>

            <div class="space-y-4 pt-2">
                <button class="w-full bg-gradient-to-r from-brand to-[#FF9D5C] text-white font-black py-4 rounded-2xl shadow-lg shadow-brand/30 active:scale-[0.98] transition-all text-sm uppercase tracking-widest" x-text="step === 'login' ? 'Đăng nhập ngay' : 'Đăng ký tài khoản'"></button>
                <div class="text-center" x-show="step === 'login'">
                    <a href="#" class="text-[12px] font-bold text-brand hover:underline">Bạn quên mật khẩu ư?</a>
                </div>
            </div>

            <div class="relative py-2">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-100"></div></div>
                <div class="relative flex justify-center text-[10px] uppercase font-black"><span class="bg-white px-4 text-gray-300">Liên kết nhanh</span></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-2 bg-white border border-gray-100 py-3.5 rounded-2xl shadow-sm active:scale-[0.98] transition-all">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" class="w-5 h-5">
                    <span class="text-[13px] font-bold text-gray-700">Google</span>
                </button>
                <button class="flex items-center justify-center gap-2 bg-white border border-gray-100 py-3.5 rounded-2xl shadow-sm active:scale-[0.98] transition-all">
                    <img src="https://upload.wikimedia.org/wikipedia/en/0/04/Facebook_f_logo_%282021%29.svg" class="w-5 h-5">
                    <span class="text-[13px] font-bold text-gray-700">Facebook</span>
                </button>
            </div>

            <p class="text-center text-[13px] text-gray-400 font-medium pt-2">
                <span x-text="step === 'login' ? 'Chưa có tài khoản?' : 'Đã có tài khoản?'"></span>
                <button @click="step = (step === 'login' ? 'register' : 'login')" class="text-brand font-black ml-1 hover:underline" x-text="step === 'login' ? 'Đăng ký ngay' : 'Đăng nhập'"></button>
            </p>
        </div>
    </main>

</body>

</html>
