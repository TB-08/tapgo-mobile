<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAPGO - Mobile Preview (iPhone 12 Pro Max)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-color: #F48133;
            --iphone-width: 428px;
            --iphone-height: 926px;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #0b0f1a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(244, 129, 51, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.1) 0px, transparent 50%);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            color: white;
        }

        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
            gap: 2rem;
            align-items: center;
            justify-content: center;
        }

        /* Sidebar Styling */
        .sidebar {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 900px;
            z-index: 10;
        }

        .menu-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        .menu-container::-webkit-scrollbar {
            width: 4px;
        }
        .menu-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .page-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-link:hover, .page-link.active {
            background: rgba(244, 129, 51, 0.15);
            border-color: var(--brand-color);
            transform: translateX(10px);
        }

        .page-link i {
            color: var(--brand-color);
            width: 20px;
            text-align: center;
        }

        /* iPhone Frame Scaling Logic */
        .phone-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
        }

        .iphone-frame {
            position: relative;
            width: var(--iphone-width);
            height: var(--iphone-height);
            background: #111;
            border-radius: 68px;
            padding: 12px;
            box-shadow: 
                0 0 0 4px #222,
                0 0 0 7px #111,
                0 50px 100px -20px rgba(0,0,0,0.8);
            transform-origin: center center;
            transition: transform 0.2s ease-out;
            flex-shrink: 0;
        }

        .iphone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 56px;
            overflow: hidden;
            border: 1px solid #000;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 34px;
            background: #111;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 6px;
            pointer-events: none;
        }
        
        .notch::before {
            content: '';
            width: 40px;
            height: 5px;
            background: #222;
            border-radius: 10px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }

        /* Buttons */
        .btn-side {
            position: absolute;
            background: #222;
            border-radius: 2px;
        }
        .btn-silent { top: 100px; left: -2px; width: 4px; height: 32px; }
        .btn-vol-up { top: 160px; left: -2px; width: 4px; height: 60px; }
        .btn-vol-down { top: 230px; left: -2px; width: 4px; height: 60px; }
        .btn-power { top: 180px; right: -2px; width: 4px; height: 100px; }

        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="mb-6">
                <div class="bg-white p-3 rounded-2xl w-fit shadow-2xl mb-4">
                    <img src="Tap Go-Photoroom.png" class="h-14 w-auto object-contain" alt="Tapgo Logo">
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] text-[#F48133] font-black uppercase tracking-[0.2em]">tạo là có Deal</p>
                    <div class="flex items-center gap-2">
                        <span class="bg-[#F48133]/20 text-[#F48133] text-[9px] font-black px-2 py-0.5 rounded-full uppercase">Mobile V2.0</span>
                        <span class="text-gray-500 text-[10px] font-bold">iPhone 12 Pro Max</span>
                    </div>
                </div>
            </div>

            <nav class="menu-container pr-2">
                <div class="space-y-1">
                    <div onclick="changePage('home_website.html', this)" class="page-link active">
                        <i class="fas fa-home"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Trang chủ</span>
                    </div>
                    <div onclick="changePage('category_website.html', this)" class="page-link">
                        <i class="fas fa-th-large"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Danh mục Ưu đãi</span>
                    </div>
                    <div onclick="changePage('product_detail.html', this)" class="page-link">
                        <i class="fas fa-star"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Chi tiết sản phẩm</span>
                    </div>
                    <div onclick="changePage('home_website.html?openQr', this)" class="page-link">
                        <i class="fas fa-qrcode"></i>
                        <span class="font-bold text-xs uppercase tracking-wider text-[#F48133]">Quét mã QR</span>
                    </div>
                    <div onclick="changePage('booking_website.html', this)" class="page-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Đặt bàn</span>
                    </div>
                    <div onclick="changePage('booking_confirm.html', this)" class="page-link">
                        <i class="fas fa-clipboard-check"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Xác nhận đặt bàn</span>
                    </div>
                    <div onclick="changePage('my_vouchers.html', this)" class="page-link">
                        <i class="fas fa-ticket-alt"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Ví Voucher</span>
                    </div>
                    <div onclick="changePage('checkout_website.html', this)" class="page-link">
                        <i class="fas fa-wallet"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Thanh toán</span>
                    </div>
                    <div onclick="changePage('login_website.html', this)" class="page-link">
                        <i class="fas fa-user-circle"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Đăng nhập</span>
                    </div>
                </div>

                <div class="h-px bg-white/5 my-6"></div>
                <p class="text-[9px] font-black text-gray-500 uppercase tracking-[0.2em] mb-4 px-4">Vendor View</p>

                <div class="space-y-1">
                    <div onclick="changePage('vendor_website.html', this)" class="page-link">
                        <i class="fas fa-chart-line"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Dashboard</span>
                    </div>
                    <div onclick="changePage('login_vendor.html', this)" class="page-link">
                        <i class="fas fa-user-shield"></i>
                        <span class="font-bold text-xs uppercase tracking-wider">Vendor Login</span>
                    </div>
                </div>
            </nav>

            <div class="mt-6 p-5 bg-white/5 border border-white/10 rounded-3xl backdrop-blur-md">
                <p class="text-[10px] text-gray-400 leading-relaxed flex items-start gap-2">
                    <i class="fas fa-info-circle text-[#F48133] mt-0.5"></i>
                    <span><b>Safe Area Fixed:</b> Giao diện đã được tối ưu cho iPhone 12 Pro Max với Notch và thanh điều hướng.</span>
                </p>
            </div>
        </aside>

        <!-- PHONE PREVIEW -->
        <div class="phone-wrapper">
            <div id="iphoneFrame" class="iphone-frame">
                <div class="btn-side btn-silent"></div>
                <div class="btn-side btn-vol-up"></div>
                <div class="btn-side btn-vol-down"></div>
                <div class="btn-side btn-power"></div>
                
                <div class="iphone-screen">
                    <div class="notch"></div>
                    <iframe id="mobileIframe" src="home_website.html"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changePage(url, el) {
            document.getElementById('mobileIframe').src = url;
            document.querySelectorAll('.page-link').forEach(link => link.classList.remove('active'));
            el.classList.add('active');
        }

        function adjustScale() {
            const frame = document.getElementById('iphoneFrame');
            const wrapper = document.querySelector('.phone-wrapper');
            
            if (!frame || !wrapper) return;

            const padding = 60;
            const availableHeight = wrapper.offsetHeight - padding;
            const availableWidth = wrapper.offsetWidth - padding;
            
            const frameHeight = 926 + 30; // height + frame border/padding
            const frameWidth = 428 + 30;  // width + frame border/padding
            
            const scaleH = availableHeight / frameHeight;
            const scaleW = availableWidth / frameWidth;
            
            let finalScale = Math.min(scaleH, scaleW);
            
            // Limit scale between 0.2 and 1.0
            finalScale = Math.max(0.2, Math.min(finalScale, 1));
            
            frame.style.transform = `scale(${finalScale})`;
        }

        window.addEventListener('resize', adjustScale);
        window.addEventListener('load', adjustScale);
        
        // Initial call with a small delay to ensure wrapper height is correct
        setTimeout(adjustScale, 100);
    </script>


</body>
</html>
