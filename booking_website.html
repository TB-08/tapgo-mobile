<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAPGO - Đặt bàn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="data.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#F48133', hover: '#E06B1F', bg: '#FFF3EB' },
                        danger: '#EF4444', success: '#10B981',
                        tier: { silver: '#9CA3AF', gold: '#FBBF24', platinum: '#1F2937' }
                    }
                },
                screens: {
                    'sm': '9999px', 'md': '9999px', 'lg': '9999px', 'xl': '9999px', '2xl': '9999px'
                }
            }
        }
    </script>
    <style>
        :root {
            --mobile-width: 428px;
        }

        body {
            background-color: transparent !important;
            font-family: 'Be Vietnam Pro', sans-serif !important;
            max-width: var(--mobile-width) !important;
            margin: 0 auto !important;
            min-height: 100dvh !important;
            box-shadow: 0 0 100px rgba(0,0,0,0.1) !important;
            position: relative !important;
            overflow-x: hidden !important;
            padding-bottom: 100px !important;
        }

        .pt-safe {
            padding-top: 47px;
        }

        .status-bar-mock {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--mobile-width);
            height: 47px;
            z-index: 2000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            pointer-events: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        .chip-active {
            background-color: #F48133 !important;
            color: white !important;
            border-color: #F48133 !important;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        *::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        * {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* DA NANG SIGNATURE BACKGROUND */
        .danang-vibe-bg {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--mobile-width);
            height: 100%;
            background: linear-gradient(rgba(250, 250, 250, 0.88), rgba(250, 250, 250, 0.88)), url('danang_dragon_bridge_bg_1778333910476.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center bottom;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body x-data="{ selectedDate: '15', selectedTime: '19:00', guests: 2 }" class="text-gray-900 antialiased font-sans flex flex-col min-h-screen">
    <!-- DA NANG SIGNATURE BACKGROUND LAYER -->
    <div class="danang-vibe-bg"></div>

    <!-- STATUS BAR MOCKUP -->
    <div class="status-bar-mock">
        <div class="flex-1">9:41</div>
        <div class="flex gap-1.5 items-center">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- MOBILE HEADER -->
    <header class="bg-white/90 backdrop-blur-xl sticky top-0 z-[100] border-b border-gray-100/50 pt-safe shadow-sm">
        <div class="px-4 py-4 flex items-center gap-3">
            <a href="product_detail.html" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-gray-600">
                <i class="fas fa-chevron-left"></i>
            </a>
            <h1 class="text-lg font-bold flex-1">Đặt bàn trực tuyến</h1>
        </div>
    </header>

    <main class="w-full p-4 space-y-8 flex-1">
        
        <!-- Restaurant Summary -->
        <div class="flex items-center gap-4 p-4 bg-white rounded-3xl border border-gray-100">
            <img src="https://images.unsplash.com/photo-1544148103-0773bf10d330?q=80&w=200" class="w-16 h-16 rounded-2xl object-cover">
            <div>
                <h3 class="font-bold text-[15px]">Yakimono Restaurant</h3>
                <p class="text-[11px] text-gray-400 mt-0.5"><i class="fas fa-map-marker-alt text-brand mr-1"></i> 36 Nguyên Hồng, Hà Nội</p>
            </div>
        </div>

        <!-- Date Selection -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-bold">Chọn ngày đến</h3>
                <span class="text-[11px] font-bold text-brand">Tháng 5, 2024</span>
            </div>
            <div class="flex justify-center gap-2 overflow-x-auto hide-scrollbar pb-2">
                <template x-for="day in [
                    {l: 'T2', d: '15'}, {l: 'T3', d: '16'}, {l: 'T4', d: '17'}, {l: 'T5', d: '18'}, {l: 'T6', d: '19'}, {l: 'T7', d: '20'}, {l: 'CN', d: '21'}
                ]">
                    <button @click="selectedDate = day.d" :class="selectedDate === day.d ? 'chip-active shadow-lg shadow-brand/20' : 'bg-white border-gray-100 text-gray-400'" class="min-w-[48px] h-16 rounded-2xl border flex flex-col items-center justify-center transition-all">
                        <span class="text-[8px] font-bold uppercase mb-1" x-text="day.l"></span>
                        <span class="text-base font-bold" x-text="day.d"></span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Guests Selection -->
        <div class="space-y-4">
            <h3 class="text-sm font-bold ml-1">Số lượng khách</h3>
            <div class="flex items-center justify-between bg-white p-4 rounded-3xl border border-gray-100">
                <button @click="guests > 1 ? guests-- : null" class="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center text-gray-400 active:scale-90 transition">
                    <i class="fas fa-minus"></i>
                </button>
                <div class="text-center">
                    <span class="text-2xl font-bold" x-text="guests"></span>
                    <span class="text-xs font-bold text-gray-400 ml-1">NGƯỜI</span>
                </div>
                <button @click="guests++" class="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center text-gray-400 active:scale-90 transition">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- Time Selection -->
        <div class="space-y-6">
            <div class="space-y-3">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-sun text-brand"></i> Buổi Trưa
                </p>
                <div class="grid grid-cols-4 gap-2">
                    <template x-for="t in ['11:00', '11:30', '12:00', '12:30']">
                        <button @click="selectedTime = t" :class="selectedTime === t ? 'chip-active shadow-md' : 'bg-white text-gray-600'" class="py-3 rounded-xl border border-gray-100 text-xs font-bold transition-all" x-text="t"></button>
                    </template>
                </div>
            </div>
            <div class="space-y-3">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-moon text-blue-400"></i> Buổi Tối
                </p>
                <div class="grid grid-cols-4 gap-2">
                    <template x-for="t in ['18:00', '18:30', '19:00', '19:30', '20:00', '20:30']">
                        <button @click="selectedTime = t" :class="selectedTime === t ? 'chip-active shadow-md' : 'bg-white text-gray-600'" class="py-3 rounded-xl border border-gray-100 text-xs font-bold transition-all" x-text="t"></button>
                    </template>
                </div>
            </div>
        </div>

    </main>

    <!-- STICKY BOTTOM ACTION -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[428px] bg-white border-t border-gray-100 p-4 pb-safe z-[500] shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
        <a href="booking_confirm.html" class="block w-full bg-brand text-white font-bold py-4 rounded-2xl text-center shadow-lg shadow-brand/20 active:scale-95 transition-transform uppercase tracking-wider">
            Xác nhận đặt bàn
        </a>
    </div>

</body>

</html>
